<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Web Engine</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><span class="eyebrow">AI WEB ENGINE / LOCAL</span><h1>你的本地 AI 工作台</h1></div><span id="health" class="pill">连接中</span></header><div class="layout"><aside><button id="newSession" class="primary">＋ 新会话</button><h2>历史会话</h2><div id="sessions" class="sessions"></div><p class="privacy">仅监听 127.0.0.1<br>会话使用 AES-256-GCM 加密文件。</p></aside><main><section class="toolbar"><label>模型<select id="model"></select></label><label>推理等级<select id="reasoning"><option value="off">关闭</option><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label><button id="settings">模型设置</button></section><section id="chat" class="chat"></section><form id="composer"><textarea id="message" rows="3" placeholder="描述你要生成的 ShortX Rule 或 DirectAction…"></textarea><button class="primary" type="submit">发送 ↗</button></form></main></div><dialog id="configDialog"><form method="dialog" id="configForm"><h2>模型服务设置</h2><label>服务商<input id="provider" required placeholder="deepseek / openai / anthropic / custom"></label><label>端点<input id="endpoint" type="url" required placeholder="https://api.example.com"></label><label>协议<select id="protocol"><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option></select></label><label>API Key<input id="apiKey" type="password" autocomplete="off"></label><label>默认模型 ID<input id="defaultModel" required></label><label>模型列表（每行一个 ID）<textarea id="models" rows="3"></textarea></label><label>默认推理等级<select id="configReasoning"><option>off</option><option>low</option><option selected>medium</option><option>high</option></select></label><div class="dialog-actions"><button value="cancel">取消</button><button class="primary" id="saveConfig" value="default">保存</button></div></form></dialog><script src="/app.js"></script></body></html>
