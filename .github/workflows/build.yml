name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: 0
  GOOS: linux

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Reject local-only project state
        run: |
          set -eu
          ! git ls-files --error-unmatch PROJECT_STATE.json >/dev/null 2>&1
          ! git ls-files --error-unmatch PROJECT_STATUS.md >/dev/null 2>&1
          ! git ls-files '.project-continuity/**' | grep -q .
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            asset: ai-web-engine-android-arm64
            elf_class: ELF64
            elf_machine: AArch64
          - goarch: arm
            goarm: '7'
            asset: ai-web-engine-android-armv7
            elf_class: ELF32
            elf_machine: ARM
          - goarch: amd64
            asset: ai-web-engine-android-x86_64
            elf_class: ELF64
            elf_machine: X86-64
          - goarch: 386
            asset: ai-web-engine-android-x86
            elf_class: ELF32
            elf_machine: Intel 80386
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ${{ matrix.asset }}
        env:
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -ldflags "-s -w" -o "${{ matrix.asset }}" ./cmd
          test -s "${{ matrix.asset }}"
          readelf -h "${{ matrix.asset }}" | grep -F "Class:" | grep -F "${{ matrix.elf_class }}"
          readelf -h "${{ matrix.asset }}" | grep -F "Machine:" | grep -F "${{ matrix.elf_machine }}"
      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ai-web-engine-android-*
          merge-multiple: true
      - name: Validate and package all architectures
        run: |
          set -eu
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
          for f in dist/*; do test -s "$f"; done
          cp manifest-android.json dist/manifest-android.json
          (cd dist && sha256sum ai-web-engine-android-* manifest-android.json > SHA256SUMS)
          (cd dist && zip -9 -r ../ai-web-engine-android-all.zip ai-web-engine-android-* manifest-android.json SHA256SUMS)
          test -s ai-web-engine-android-all.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ai-web-engine-android-arm64
            dist/ai-web-engine-android-armv7
            dist/ai-web-engine-android-x86_64
            dist/ai-web-engine-android-x86
            dist/manifest-android.json
            dist/SHA256SUMS
            ai-web-engine-android-all.zip
          generate_release_notes: true
      - name: Retain only the newest two releases after successful current release
        if: success() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          releases=$(mktemp)
          trap 'rm -f "$releases"' EXIT
          gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName' |
            sort -V -r >"$releases"
          keep=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            keep=$((keep + 1))
            if [ "$keep" -le 2 ]; then
              continue
            fi
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done <"$releases"
          test "$(gh release list --limit 100 --json tagName,isDraft --jq '[.[] | select(.isDraft == false)] | length')" -le 2

  sync-changelog:
    needs: package
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Notify changelog repository
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_REPO_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          test -n "$GH_TOKEN" || { echo 'CHANGELOG_REPO_TOKEN is required for changelog sync' >&2; exit 1; }
          gh api --method POST repos/snowzlmbot/ai-web-engine-changelog/dispatches \
            -f event_type=ai-web-engine-release \
            -f "client_payload[tag_name]=$RELEASE_TAG" \
            -f "client_payload[source_repo]=$GITHUB_REPOSITORY"
