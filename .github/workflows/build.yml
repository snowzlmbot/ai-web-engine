name: build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: 0
  GOOS: linux

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Reject local-only project state
        run: |
          set -eu
          ! git ls-files --error-unmatch PROJECT_STATE.json >/dev/null 2>&1
          ! git ls-files --error-unmatch PROJECT_STATUS.md >/dev/null 2>&1
          ! git ls-files '.project-continuity/**' | grep -q .
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            asset: ai-web-engine-android-arm64
            elf_class: ELF64
            elf_machine: AArch64
          - goarch: arm
            goarm: '7'
            asset: ai-web-engine-android-armv7
            elf_class: ELF32
            elf_machine: ARM
          - goarch: amd64
            asset: ai-web-engine-android-x86_64
            elf_class: ELF64
            elf_machine: X86-64
          - goarch: 386
            asset: ai-web-engine-android-x86
            elf_class: ELF32
            elf_machine: Intel 80386
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ${{ matrix.asset }}
        env:
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -ldflags "-s -w" -o "${{ matrix.asset }}" ./cmd
          test -s "${{ matrix.asset }}"
          readelf -h "${{ matrix.asset }}" | grep -F "Class:" | grep -F "${{ matrix.elf_class }}"
          readelf -h "${{ matrix.asset }}" | grep -F "Machine:" | grep -F "${{ matrix.elf_machine }}"
      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ai-web-engine-android-*
          merge-multiple: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Validate and package all architectures
        run: |
          set -eu
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
          for f in dist/*; do test -s "$f"; done
          cp manifest-android.json dist/manifest-android.json
          cp scripts/init.sh dist/ai-web-engine-script-init.sh
          cp scripts/start.sh dist/ai-web-engine-script-start.sh
          cp scripts/stop.sh dist/ai-web-engine-script-stop.sh
          cp scripts/rollback.sh dist/ai-web-engine-script-rollback.sh
          (cd dist && sha256sum ai-web-engine-android-* manifest-android.json ai-web-engine-script-*.sh > SHA256SUMS)
          (cd dist && zip -9 -r ../ai-web-engine-android-all.zip ai-web-engine-android-* manifest-android.json ai-web-engine-script-*.sh SHA256SUMS)
          test -s ai-web-engine-android-all.zip
      - name: Release disabled in public repository
        if: ${{ false }}
        run: echo 'Signed releases are published only from the private source repository.'
